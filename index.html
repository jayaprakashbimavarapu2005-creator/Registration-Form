<!DOCTYPE html>
<html>
<head>
    <title>registration form</title>
    <style>
body{
    margin: 100px auto;
    margin-left: 430px;
    font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
    background-color: azure;
}
.form{
    border: 3px solid black;
    width: 365px;
    padding: 10px;
    border-radius: 10px;
    background-color: antiquewhite;
}
.prakash input{
    width: 300px;
    height: 40px;
    color: black;
}
.prakash input:hover{
    background-color: cadetblue;
}
button{
    margin-top: 10px;
    margin-left: 110px;
    width: 120px;
    height: 30px;
    border: 2px solid black;
}
button:hover{
    background-color: chartreuse;
    border-radius: 15px;
}
    </style>
</head>
<body><div class="form">
    <div class="prakash">
    <h1>Registration Form</h1>
    <p>Please fill out the folliwing fields to register.</p>
    <label>Your Name</label><br>
    <input type="text" placeholder="Enter your name"><br>
    <label>Email Address</label><br>
    <input type="email" placeholder="Enter your adderss"><br>
    <label>Phone Number</label><br>
    <input type="number" placeholder="Enter your phone number"><br>
    <label>Date of Birth</label><br>
    <input type="date" placeholder="Enter your birth date"><br>
    </div>
    <h2>Gender</h2>
    <input type="radio" name="Gender" value="Male">Male<br>
    <input type="radio" name="Gender" value="Female">Female<br>
    <input type="radio" name="Gender" >Prefer not to say<br>

<input type="checkbox"> I agree to the terms and conditions<br>

<button type="submit">register</button>
    </div>
</body>
</html>
